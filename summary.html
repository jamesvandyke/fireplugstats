<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111827">
    <title>Game Summary — Fireplug Stats</title>
    <link rel="stylesheet" href="styles.css?v=14">
    <style>
      .summary-shell {
        width: min(100%, 600px);
        margin: 0 auto;
        padding: max(18px, env(safe-area-inset-top)) 14px max(28px, env(safe-area-inset-bottom));
        display: grid;
        gap: 20px;
      }

      .summary-header {
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--paper);
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 10px;
        align-items: center;
        text-align: center;
        box-shadow: 0 10px 24px rgb(17 24 39 / 8%);
      }

      .summary-team {
        display: grid;
        gap: 4px;
      }

      .summary-team-name {
        font-size: 13px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .summary-score {
        font-size: 52px;
        font-weight: 950;
        line-height: 1;
        color: var(--ink);
      }

      .summary-score-home { color: var(--hornets); }
      .summary-score-away { color: var(--away); }

      .summary-divider {
        font-size: 22px;
        font-weight: 900;
        color: var(--muted);
      }

      .summary-date {
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .summary-section-title {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 900;
        text-transform: uppercase;
      }

      .summary-courts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .summary-court-wrap {
        display: grid;
        gap: 6px;
      }

      .summary-court-label {
        font-size: 12px;
        font-weight: 900;
        text-transform: uppercase;
        color: var(--muted);
        text-align: center;
      }

      .summary-error {
        padding: 40px 20px;
        text-align: center;
        color: var(--muted);
        font-size: 16px;
        font-weight: 700;
      }

      .summary-wordmark {
        text-align: center;
        color: var(--muted);
        font-size: 12px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding-top: 8px;
      }

      @media (max-width: 480px) {
        .summary-courts {
          grid-template-columns: 1fr;
        }
        .summary-score {
          font-size: 40px;
        }
      }
    </style>
  </head>
  <body>
    <main class="summary-shell" id="summaryRoot">
      <p class="summary-error">Loading game summary…</p>
    </main>
    <script src="summary.js?v=14" type="module"></script>
  </body>
</html>
