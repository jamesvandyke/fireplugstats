<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111827">
    <title>Game Summary — Fireplug Stats</title>
    <link rel="stylesheet" href="styles.css?v=18">
    <style>
      .summary-shell {
        width: min(100%, 600px);
        margin: 0 auto;
        padding: max(18px, env(safe-area-inset-top)) 14px max(28px, env(safe-area-inset-bottom));
        display: grid;
        gap: 20px;
      }

      .summary-header {
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--paper);
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 10px;
        align-items: center;
        text-align: center;
        box-shadow: 0 10px 24px rgb(17 24 39 / 8%);
      }

      .summary-team {
        display: grid;
        gap: 4px;
      }

      .summary-team-name {
        font-size: 13px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .summary-score {
        font-size: 52px;
        font-weight: 950;
        line-height: 1;
        color: var(--ink);
      }

      .summary-score-home { color: var(--hornets); }
      .summary-score-away { color: var(--away); }

      .summary-divider {
        font-size: 22px;
        font-weight: 900;
        color: var(--muted);
      }

      .summary-date {
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .summary-section-title {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 900;
        text-transform: uppercase;
      }

      .summary-courts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .summary-court-wrap {
        display: grid;
        gap: 6px;
      }

      .summary-court-label {
        font-size: 12px;
        font-weight: 900;
        text-transform: uppercase;
        color: var(--muted);
        text-align: center;
      }

      .summary-error {
        padding: 40px 20px;
        text-align: center;
        color: var(--muted);
        font-size: 16px;
        font-weight: 700;
      }

      .summary-team-name {
        text-decoration: none;
        display: block;
      }

      .summary-share-btn {
        width: 100%;
        min-height: 52px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--paper);
        color: var(--ink);
        font-size: 16px;
        font-weight: 900;
        cursor: pointer;
      }

      .summary-box {
        display: grid;
        gap: 10px;
      }

      /* Compact tables used for period scores and team comparison */
      .summary-compact-table,
      .summary-compare-table {
        width: 100%;
        border-collapse: collapse;
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
        background: var(--paper);
      }

      .summary-compact-table th,
      .summary-compact-table td,
      .summary-compare-table th,
      .summary-compare-table td {
        padding: 10px 12px;
        font-size: 14px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }

      .summary-compact-table tbody tr:last-child th,
      .summary-compact-table tbody tr:last-child td,
      .summary-compare-table tbody tr:last-child th,
      .summary-compare-table tbody tr:last-child td {
        border-bottom: 0;
      }

      .summary-compact-table thead th {
        background: #eee6db;
        font-size: 12px;
        font-weight: 900;
        text-transform: uppercase;
        color: var(--muted);
        text-align: center;
      }

      .summary-compact-table thead th:first-child {
        text-align: left;
      }

      .summary-compact-table tbody th {
        font-size: 13px;
        font-weight: 900;
        text-align: left;
      }

      .summary-compact-table tbody td {
        text-align: center;
        font-size: 15px;
        font-weight: 700;
      }

      .period-total {
        font-weight: 950 !important;
        border-left: 1px solid var(--line);
      }

      /* Team comparison table */
      .summary-compare-table thead th {
        font-size: 13px;
        font-weight: 900;
        padding: 10px 12px;
        background: #eee6db;
        text-align: center;
      }

      .summary-compare-table thead th:first-child { text-align: left; }
      .summary-compare-table thead th:last-child  { text-align: right; }

      .summary-compare-table tbody th {
        text-align: center;
        font-size: 12px;
        font-weight: 900;
        text-transform: uppercase;
        color: var(--muted);
        letter-spacing: 0.04em;
      }

      .summary-compare-table tbody td {
        font-size: 16px;
        font-weight: 800;
        text-align: left;
      }

      .summary-compare-table tbody td:last-child {
        text-align: right;
      }

      /* Top performers */
      .top-performers {
        display: grid;
        gap: 10px;
      }

      .top-perf-row {
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--paper);
        display: grid;
        gap: 8px;
      }

      .top-perf-label {
        font-size: 11px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
      }

      .top-perf-teams {
        display: grid;
        gap: 4px;
      }

      .top-perf-player {
        font-size: 14px;
        font-weight: 800;
      }

      .top-perf-team {
        font-size: 11px;
        font-weight: 900;
        text-transform: uppercase;
        margin-right: 4px;
      }

      .top-perf-unit {
        color: var(--muted);
        font-size: 12px;
      }

      .summary-wordmark {
        text-align: center;
        color: var(--muted);
        font-size: 12px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding-top: 8px;
      }

      @media (max-width: 480px) {
        .summary-courts {
          grid-template-columns: 1fr;
        }
        .summary-score {
          font-size: 40px;
        }
      }
    </style>
  </head>
  <body>
    <main class="summary-shell" id="summaryRoot">
      <p class="summary-error">Loading game summary…</p>
    </main>
    <script src="summary.js?v=18" type="module"></script>
  </body>
</html>
