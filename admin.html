<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111827">
    <title>Teams — Fireplug Stats</title>
    <link rel="stylesheet" href="styles.css?v=20">
    <style>
      .admin-shell {
        width: min(100%, 600px);
        margin: 0 auto;
        padding: max(18px, env(safe-area-inset-top)) 14px max(32px, env(safe-area-inset-bottom));
        display: grid;
        gap: 16px;
      }

      .admin-header {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 10px;
        align-items: center;
        min-height: 58px;
      }

      .admin-header h1 {
        font-size: 22px;
      }

      .back-btn {
        min-width: 44px;
        min-height: 44px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--ink);
        font-size: 22px;
        font-weight: 800;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .team-list {
        display: grid;
        gap: 8px;
      }

      .team-card {
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--paper);
        display: grid;
        grid-template-columns: 28px 1fr auto auto;
        gap: 10px;
        align-items: center;
      }

      .color-swatch {
        width: 28px;
        height: 28px;
        border-radius: 7px;
        border: 1px solid rgb(0 0 0 / 12%);
        flex-shrink: 0;
      }

      .team-card-info strong {
        display: block;
        font-size: 16px;
        line-height: 1.2;
      }

      .team-card-info span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .icon-action-btn {
        min-width: 44px;
        min-height: 44px;
        border: 0;
        border-radius: 8px;
        background: #eee6db;
        color: var(--ink);
        font-size: 15px;
        font-weight: 850;
      }

      .icon-action-btn.danger {
        background: #fee2e2;
        color: #b91c1c;
      }

      .admin-empty {
        padding: 32px 20px;
        text-align: center;
        color: var(--muted);
        font-size: 15px;
        font-weight: 700;
        border: 1px dashed var(--line);
        border-radius: 10px;
      }

      /* Team form dialog */
      #teamDialog {
        width: min(calc(100vw - 24px), 560px);
        max-height: 90svh;
        overflow-y: auto;
        padding: 20px;
      }

      .dialog-header {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
        margin-bottom: 16px;
      }

      .dialog-header h2 {
        margin: 0;
        font-size: 20px;
        color: var(--ink);
        text-transform: none;
      }

      .form-field {
        display: grid;
        gap: 6px;
        margin-bottom: 14px;
      }

      .form-field label {
        color: var(--muted);
        font-size: 12px;
        font-weight: 900;
        text-transform: uppercase;
      }

      .form-field input[type="text"],
      .form-field input[type="number"] {
        min-height: 48px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        font-size: 16px;
        font-weight: 850;
        width: 100%;
      }

      .form-field input[type="color"] {
        width: 100%;
        min-height: 48px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      .color-name-row {
        display: grid;
        grid-template-columns: 80px 1fr;
        gap: 10px;
        margin-bottom: 14px;
      }

      .player-section-header {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        margin-bottom: 8px;
      }

      .player-section-header span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 900;
        text-transform: uppercase;
      }

      .player-table-wrap {
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 14px;
      }

      .player-table {
        width: 100%;
        border-collapse: collapse;
      }

      .player-table th {
        padding: 8px 10px;
        background: #eee6db;
        color: var(--muted);
        font-size: 11px;
        font-weight: 900;
        text-align: left;
        text-transform: uppercase;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }

      .player-table th:first-child {
        width: 80px;
      }

      .player-table th:last-child {
        width: 40px;
        text-align: center;
      }

      .player-row td {
        padding: 6px 8px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }

      .player-row:last-child td {
        border-bottom: 0;
      }

      .player-row input[type="number"] {
        width: 70px;
        min-height: 38px;
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--paper);
        font-size: 15px;
        font-weight: 850;
      }

      .player-row input[type="text"] {
        width: 100%;
        min-height: 38px;
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--paper);
        font-size: 15px;
        font-weight: 850;
      }

      .player-row .remove-player-btn {
        width: 32px;
        height: 32px;
        border: 0;
        border-radius: 6px;
        background: #fee2e2;
        color: #b91c1c;
        font-size: 16px;
        font-weight: 900;
        display: block;
        margin: 0 auto;
      }

      .form-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 4px;
      }

      .cancel-btn {
        min-height: 56px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        color: var(--ink);
        font-size: 17px;
        font-weight: 900;
      }

      .save-team-btn {
        min-height: 56px;
        border: 0;
        border-radius: 8px;
        background: var(--ink);
        color: white;
        font-size: 17px;
        font-weight: 900;
      }

      .form-status {
        min-height: 20px;
        margin-top: 8px;
        color: var(--hornets);
        font-size: 13px;
        font-weight: 850;
        text-align: center;
      }

      @media (max-width: 480px) {
        .color-name-row {
          grid-template-columns: 60px 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="admin-shell">
      <div class="admin-header">
        <a href="/" class="back-btn" aria-label="Back to scoreboard">‹</a>
        <h1>Teams</h1>
        <button class="text-btn" id="newTeamBtn" type="button">+ New Team</button>
      </div>
      <div class="team-list" id="teamList">
        <div class="admin-empty">Loading teams…</div>
      </div>
    </main>

    <dialog id="teamDialog">
      <div class="dialog-header">
        <h2 id="dialogTitle">New Team</h2>
        <button class="icon-action-btn" id="closeDialogBtn" type="button" aria-label="Close">✕</button>
      </div>
      <div class="color-name-row">
        <div class="form-field">
          <label for="teamColor">Color</label>
          <input type="color" id="teamColor" value="#0f766e">
        </div>
        <div class="form-field">
          <label for="teamName">Team name</label>
          <input type="text" id="teamName" maxlength="24" placeholder="e.g. Hornets">
        </div>
      </div>
      <div class="player-section-header">
        <span>Roster</span>
        <button class="text-btn" id="addPlayerBtn" type="button" style="min-height:36px;font-size:13px;padding:0 12px">+ Add player</button>
      </div>
      <div class="player-table-wrap">
        <table class="player-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="playerTableBody"></tbody>
        </table>
      </div>
      <div class="form-actions">
        <button class="cancel-btn" id="cancelBtn" type="button">Cancel</button>
        <button class="save-team-btn" id="saveTeamBtn" type="button">Save</button>
      </div>
      <p class="form-status" id="formStatus" role="status"></p>
    </dialog>

    <script src="admin.js?v=17" type="module"></script>
  </body>
</html>
